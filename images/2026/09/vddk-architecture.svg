<svg viewBox="0 0 900 460" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="460" fill="#f7f9fb"/>

  <!-- Title -->
  <text x="450" y="34" text-anchor="middle" font-size="20" font-weight="600" fill="#1a202c">Where the VDDK Sits in a Backup / Migration Workflow</text>

  <!-- Third party software -->
  <rect x="40" y="90" width="230" height="110" rx="10" fill="#e8f0fe" stroke="#4c6ef5" stroke-width="2"/>
  <text x="155" y="130" text-anchor="middle" font-size="15" font-weight="600" fill="#1a202c">Backup / Migration</text>
  <text x="155" y="150" text-anchor="middle" font-size="15" font-weight="600" fill="#1a202c">Software</text>
  <text x="155" y="175" text-anchor="middle" font-size="12" fill="#4a5568">(3rd-party vendor or</text>
  <text x="155" y="192" text-anchor="middle" font-size="12" fill="#4a5568">open-source project)</text>

  <!-- Arrow 1 -->
  <line x1="270" y1="145" x2="345" y2="145" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="307" y="132" text-anchor="middle" font-size="11" fill="#4a5568">links against</text>

  <!-- VDDK library -->
  <rect x="345" y="70" width="210" height="150" rx="10" fill="#fff4e5" stroke="#e8890c" stroke-width="2"/>
  <text x="450" y="100" text-anchor="middle" font-size="15" font-weight="700" fill="#1a202c">VDDK</text>
  <text x="450" y="118" text-anchor="middle" font-size="11" fill="#4a5568">Virtual Disk</text>
  <text x="450" y="133" text-anchor="middle" font-size="11" fill="#4a5568">Development Kit</text>
  <line x1="365" y1="145" x2="535" y2="145" stroke="#e8890c" stroke-width="1"/>
  <text x="450" y="163" text-anchor="middle" font-size="11" fill="#7c4a03">NBD transport</text>
  <text x="450" y="180" text-anchor="middle" font-size="11" fill="#7c4a03">HotAdd transport</text>
  <text x="450" y="197" text-anchor="middle" font-size="11" fill="#7c4a03">SAN transport</text>

  <!-- Arrow 2 -->
  <line x1="555" y1="145" x2="630" y2="145" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="592" y="132" text-anchor="middle" font-size="11" fill="#4a5568">reads / writes</text>

  <!-- vSphere storage -->
  <rect x="630" y="90" width="230" height="110" rx="10" fill="#e6f7ec" stroke="#2f9e44" stroke-width="2"/>
  <text x="745" y="130" text-anchor="middle" font-size="15" font-weight="600" fill="#1a202c">Virtual Disks</text>
  <text x="745" y="150" text-anchor="middle" font-size="15" font-weight="600" fill="#1a202c">(VMDK on Datastore)</text>
  <text x="745" y="175" text-anchor="middle" font-size="12" fill="#4a5568">outside the guest OS,</text>
  <text x="745" y="192" text-anchor="middle" font-size="12" fill="#4a5568">block-level access</text>

  <!-- Bottom explanatory strip -->
  <rect x="40" y="260" width="820" height="150" rx="10" fill="#ffffff" stroke="#dde3ea" stroke-width="1.5"/>
  <text x="60" y="290" font-size="14" font-weight="600" fill="#1a202c">Why this matters</text>
  <text x="60" y="316" font-size="12.5" fill="#3d4451">Without VDDK, software cannot stream a virtual disk's blocks directly from the</text>
  <text x="60" y="336" font-size="12.5" fill="#3d4451">hypervisor layer. It would instead need to fall back to slower, less efficient paths —</text>
  <text x="60" y="356" font-size="12.5" fill="#3d4451">such as exporting a full OVF/OVA image, reading through the guest OS, or another</text>
  <text x="60" y="376" font-size="12.5" fill="#3d4451">storage-layer mechanism — each with real trade-offs in speed, footprint, and complexity.</text>

  <text x="450" y="440" text-anchor="middle" font-size="11" fill="#8a94a3">Diagram: general VDDK data-path concept — not vendor specific</text>
</svg>
